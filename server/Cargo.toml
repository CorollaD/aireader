[package]
name = "aireader-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8", features = ["macros"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
rand = "0.10.3"
rpassword = "7.5.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "net", "signal", "io-util", "sync"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "stream"] }
tempfile = "3.27.0"
