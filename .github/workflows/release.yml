# Builds installers for macOS (Apple silicon and Intel), Linux and Windows when a version tag
# such as v0.2.0 is pushed (or when run by hand), and publishes them as a GitHub release.
# The release is created as a draft and only made public once every platform has built.
#
# Windows installers are code-signed through SignPath when the repository has the variable
# SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN (see README, "Code signing");
# without them they are published unsigned. SHA256SUMS.txt lists checksums of every file.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PDFIUM_VERSION: "8111"

jobs:
  create-release:
    name: Create the draft release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$version"
          # Reuse the draft when the workflow is run again for the same version.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$tag\" and .draft) | .id" | head -n 1)
          if [ -z "$id" ]; then
            # The id comes from the create call itself: a new draft may not be listed yet.
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="AiReader $tag" \
              -F body=@.github/release-notes.md -F draft=true --jq .id)
          fi
          if [ -z "$id" ]; then
            echo "Could not create the draft release" >&2
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            runner: macos-latest
            target: x86_64-apple-darwin
          - name: Linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Download PDFium
        shell: bash
        env:
          PDFIUM_TARGET: ${{ matrix.target }}
        run: bash src-tauri/scripts/fetch-pdfium.sh

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          args: --target ${{ matrix.target }}

      # Windows signing: SignPath signs the installers, which then replace the unsigned ones
      # in the (still draft) release.
      - name: Collect Windows installers for signing
        id: unsigned
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Sign with SignPath
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'aireader' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Replace the unsigned installers
        if: steps.unsigned.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ needs.create-release.outputs.id }}
        run: |
          shopt -s globstar nullglob
          files=(signed/**/*.exe signed/**/*.msi)
          [ ${#files[@]} -gt 0 ] || { echo "SignPath returned no installers" >&2; exit 1; }
          for f in "${files[@]}"; do
            name=$(basename "$f")
            old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --jq ".[] | select(.name == \"$name\") | .id")
            [ -n "$old" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
            gh api -X POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=$name" \
              -H "Content-Type: application/octet-stream" --input "$f" --jq .name
          done

  publish:
    name: Publish the release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Make the draft public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ needs.create-release.outputs.id }}
        run: |
          # Every platform must have uploaded its installers before anything goes public.
          names=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq '.assets[].name')
          echo "$names"
          for pattern in '_aarch64\.dmg$' '_x64\.dmg$' '\.AppImage$' '\.deb$' '\.rpm$' '-setup\.exe$' '\.msi$'; do
            if ! grep -qE "$pattern" <<< "$names"; then
              echo "Missing an installer matching $pattern" >&2
              exit 1
            fi
          done
          # Checksums of every file, so downloads can be verified.
          mkdir files && cd files
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq '.assets[] | select(.name != "SHA256SUMS.txt") | "\(.id) \(.name)"' |
            while read -r asset name; do
              gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "$name"
            done
          sha256sum -- * > ../SHA256SUMS.txt
          cd ..
          cat SHA256SUMS.txt
          old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --jq '.[] | select(.name == "SHA256SUMS.txt") | .id')
          [ -z "$old" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
          gh api -X POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=SHA256SUMS.txt" \
            -H "Content-Type: text/plain" --input SHA256SUMS.txt --jq .name
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=true --jq .html_url
