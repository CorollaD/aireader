# Lint, type-check and test on every push and pull request.
name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    env:
      # Faster CI builds: no debug info. Dependencies are also built unoptimised (Cargo.toml
      # optimises them for local development), with the --config flags below.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      # Also type-checks; the Rust build needs the bundled frontend in dist/.
      - name: Build frontend
        run: npm run build

      - name: Download PDFium
        run: bash src-tauri/scripts/fetch-pdfium.sh

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --config 'profile.dev.package."*".opt-level=0' -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --config 'profile.dev.package."*".opt-level=0'
