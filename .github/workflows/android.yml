# Builds the Android APK: by hand from the Actions page, or as part of a release.
#
# Signing: with the secrets ANDROID_KEYSTORE (the .jks file, base64), ANDROID_KEYSTORE_PASSWORD
# and ANDROID_KEY_ALIAS the APK is signed with that key, so each version updates the last.
# Without them it is signed with a key made for this build only: it installs (allow apps from
# unknown sources) but can't update a copy signed with another key.

name: Android

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner comes with the Android SDK and NDK installed.
      - name: Android NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "SDK: $ANDROID_HOME, NDK: $ANDROID_NDK_LATEST_HOME"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # The Android project is generated fresh, so it always matches the Tauri version.
      - name: Android project
        run: npm run tauri android init -- --ci

      # PDFium for each phone architecture, where Android loads native libraries from.
      - name: PDFium
        run: |
          for pair in aarch64-linux-android:arm64-v8a armv7-linux-androideabi:armeabi-v7a x86_64-linux-android:x86_64; do
            PDFIUM_TARGET="${pair%%:*}" bash src-tauri/scripts/fetch-pdfium.sh
            dir="src-tauri/gen/android/app/src/main/jniLibs/${pair##*:}"
            mkdir -p "$dir"
            cp src-tauri/lib/libpdfium.so "$dir/"
          done

      - name: Build APK
        run: npm run tauri android build -- --apk --target aarch64 --target armv7 --target x86_64

      - name: Sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          unsigned="$(find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' | head -n 1)"
          [ -n "$unsigned" ] || { echo "no unsigned APK was built" >&2; exit 1; }
          ks="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "$ks"
            pass="$KEYSTORE_PASSWORD"; alias="$KEY_ALIAS"
          else
            echo "::warning::No signing key in the secrets: this APK can't update one signed with another key."
            pass="$(openssl rand -hex 16)"; alias=aireader
            keytool -genkeypair -keystore "$ks" -storepass "$pass" -keypass "$pass" -alias "$alias" \
              -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=AiReader test build"
          fi
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          out="$RUNNER_TEMP/AiReader_${version}_android.apk"
          "$tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$ks" --ks-pass "pass:$pass" --ks-key-alias "$alias" --key-pass "pass:$pass" \
            --out "$out" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify "$out"
          rm -f "$ks"
          ls -la "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/AiReader_*_android.apk
          if-no-files-found: error
