# Builds an Android APK for testing, by hand from the Actions page or for a version tag. It is
# signed with a throwaway debug key, so it installs on any phone (allow installs from unknown
# sources) but can't update a store build; release signing needs a keystore in the secrets.

name: Android

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner comes with the Android SDK and NDK installed.
      - name: Android NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "SDK: $ANDROID_HOME, NDK: $ANDROID_NDK_LATEST_HOME"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # The Android project is generated fresh, so it always matches the Tauri version.
      - name: Android project
        run: npm run tauri android init -- --ci

      # PDFium for each phone architecture, where Android loads native libraries from.
      - name: PDFium
        run: |
          for pair in aarch64-linux-android:arm64-v8a armv7-linux-androideabi:armeabi-v7a x86_64-linux-android:x86_64; do
            PDFIUM_TARGET="${pair%%:*}" bash src-tauri/scripts/fetch-pdfium.sh
            dir="src-tauri/gen/android/app/src/main/jniLibs/${pair##*:}"
            mkdir -p "$dir"
            cp src-tauri/lib/libpdfium.so "$dir/"
          done

      - name: Build APK
        run: npm run tauri android build -- --debug --apk --target aarch64 --target armv7 --target x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: AiReader-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
